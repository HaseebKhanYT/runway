name: Feature request
description: Propose new user-facing functionality
labels: [type/feature]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the monorepo is affected?
      options:
        - web
        - api
        - shared
        - infra
        - docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Runway do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you rejected them.

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Acceptance criteria as a checklist. This is what a pull request will be reviewed against.
      value: "- [ ] \n"
    validations:
      required: true
