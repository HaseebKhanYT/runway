name: CI

# No `paths:` filters anywhere. Once `verify` and `integration` are required
# status checks, a workflow that skips itself never reports, and the PR blocks
# forever waiting for a check that will not arrive.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a push to a shared branch would leave that commit unverified,
  # so only PR runs are cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two jobs, not four. `pnpm install` is 40-60s and is paid per job, while the
  # whole suite runs in under five seconds — splitting further buys nothing.
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Both jobs are required checks, so a hung step blocks the pull request for
    # the six-hour default. The job finishes in under a minute.
    timeout-minutes: 10
    # No DATABASE_URL, deliberately. `prisma generate` resolves
    # `env("DATABASE_URL")` lazily and never connects, so nothing here needs
    # one — which is what lets a pull request be verified without a database.
    # Nor TZ: turbo runs tasks in strict env mode, so anything exported here is
    # filtered out before vitest sees it. The vitest configs pin the zone.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every step runs even after an earlier one fails, so a single run
      # surfaces every problem instead of one per push.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      # Only the API bundle. Vercel already builds apps/web per PR and posts
      # its own status check.
      - name: Build API
        if: ${{ !cancelled() }}
        run: pnpm --filter @runway/api build

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read by the Migrate step directly, and declared on
      # @runway/api#test:integration in turbo.json so it survives strict mode.
      DATABASE_URL: postgresql://runway:runway@localhost:5432/runway
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runway
          POSTGRES_PASSWORD: runway
          POSTGRES_DB: runway
        ports:
          - 5432:5432
        # pg_isready answers for the temporary server initdb runs before the
        # real one accepts TCP, so a first-boot probe can pass against a server
        # the job cannot reach. The start period holds the checks off until
        # entrypoint setup is done.
        options: >-
          --health-cmd pg_isready
          --health-start-period 10s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prisma generate needs no explicit step — turbo pulls it in through the
      # @runway/api#db:generate dependency.
      - name: Migrate
        run: pnpm --filter @runway/api exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration
